name: CI

on:
  push:
    branches-ignore:
      - 'master'  # issue with dependency with EvoMaster releases
    tags-ignore:
      - '**'
    paths:
      - '.github/workflows/ci.yaml'
      - 'scripts/dist.py'
      - 'scripts/build/**'
      - 'jdk_8_maven/**'
      - 'jdk_11_maven/**'
      - 'jdk_17_maven/**'
      - 'jdk_21_maven/**'
      - 'jdk_25_maven/**'
      - 'jdk_8_gradle/**'
      - 'jdk_11_gradle/**'
      - 'jdk_17_gradle/**'
      - 'jdk_21_gradle/**'
      - 'jdk_25_gradle/**'


jobs:

  build-SUTs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WFD
        uses: actions/checkout@v6
      #  this does not build EvoMaster drivers
      - name: Build SUTs With Docker
        run: python scripts/dist.py

  build-drivers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WFD
        uses: actions/checkout@v6
      # Drivers need dependency on EM client libraries.
      # Those are published on Maven Central, but not for SNAPSHOT dependencies.
      # So, we need to build and install them locally
      - name: Setup JDK for EvoMaster
        uses: actions/setup-java@v5
        with:
          # client library is on 8, but, to build whole EM, need higher.
          java-version: 17
          distribution: 'zulu'
      - name: Setup Maven
        # runner images ship Maven 3.10.0, which has some breaking changes we have not handled yet
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9
      - name: Checkout EvoMaster
        uses: actions/checkout@v6
        with:
          repository: WebFuzzing/EvoMaster
          path: evomaster
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install EvoMaster root pom.xml
        run: mvn -N clean install -DskipTests
        working-directory: evomaster
      - name: Install EvoMaster client-java
        run: mvn clean install -DskipTests
        working-directory: evomaster/client-java
      - name: Build EvoMaster Drivers
        run: python scripts/dist.py --evomaster



