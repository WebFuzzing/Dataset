              em/external/rest/testing-system em/external/rest/flight-search-api em/external/rest/pn-paper-tracker
              em/external/rest/gravitee em/external/rest-gui/webgoat em/external/rest-gui/microcks"
          mvn clean install -DskipTests -am -pl $$(echo $$EM | tr ' ' ,)
          for m in $$EM; do cp $$m/target/*-evomaster-runner.jar /dist/; done
        else
          (cd cs && mvn clean install -DskipTests)
          cp cs/rest/person-controller/target/person-controller-sut.jar /dist/
          cp cs/rest/redis-sample/target/redis-sample-sut.jar /dist/
          cp cs/rest/adoptme/target/adoptme-sut.jar /dist/
          cp cs/rest/arimaa/target/arimaa-sut.jar /dist/
          cp cs/rest/joinus/target/joinus-sut.jar /dist/
          cp cs/rest/lovemining/target/lovemining-sut.jar /dist/
          cp cs/rest/movies-xml/target/movies-xml-sut.jar /dist/
          cp cs/rest/testing-system/target/testing-system-sut.jar /dist/
          cp cs/rest/flight-search-api/target/flight-search-api-sut.jar /dist/
          cp cs/rest/pn-paper-tracker/target/pn-paper-tracker-sut.jar /dist/
          cp cs/rest/gravitee/gravitee-apim-rest-api/gravitee-apim-rest-api-standalone/gravitee-apim-rest-api-standalone-distribution/target/gravitee-sut.jar /dist/
          cp cs/rest-gui/webgoat/target/webgoat-sut.jar /dist/
