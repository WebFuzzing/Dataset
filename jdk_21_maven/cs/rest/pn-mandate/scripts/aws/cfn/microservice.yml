      - true
      - false

  OncallMandateAcceptanceFailureF02AlarmPeriod:
    Type: Number
    Default: 300

  OncallMandateAcceptanceFailureF02AlarmThreshold:
    Type: Number
    Default: 1

  OncallMandateAcceptanceFailureF02AlarmEvaluationPeriods:
    Type: Number
    Default: 12

  OncallMandateAcceptanceFailureF02AlarmPeriodDatapointsToAlarm:
    Type: Number
    Default: 1

  MandateAcceptanceFailureF03AlarmPeriodFilterPattern:
    Type: String

  MandateAcceptanceFailureF03AlarmPeriod:
    Type: Number
    Default: 300

