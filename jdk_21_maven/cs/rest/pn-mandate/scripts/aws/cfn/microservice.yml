AWSTemplateFormatVersion: 2010-09-09
Description: 'Example microservice deploy'

Parameters:
  ProjectName:
    Type: String
    Description: 'Usually pn can be pnXYZ where XYZ are the feature number, useful to create
      experimental environments without crash official development environment'

  AlarmSNSTopicArn:
    Type: String
    Description: ARN of alarm topic

  DestApiDnsName:
    Type: String
    Description: 'The DNS name used for B2B PG rest API.'
  
  CorsAllowedDomains:
    Type: String
    Description: 'Comma separated list of domains allowed to make cross origin request'

  ContainerImageUri:
    Type: String
    Description: 'Exact container image URI with full repository and image digest'

  MicroserviceNumber:
    Type: Number
    Description: 'Disambiguation useful for load balancer rules'

  TemplateBucketBaseUrl:
    Type: String
    Description: 'The S3 bucket from which to fetch the templates used by this stack.'

  ECSClusterName:
    Type: String
    Description: 'The name of the ECS cluster where the microservice is going to be deployed'

  SubnetsIds:
    Type: String
    Description: 'subnets ids comma separated list. Where to deploy the microservice'

  VpcEgressSubnetsIds:
    Type: String
    Description: subnets where to install PN-CORE

  VpcId:
    Type: String
    Description: 'VpcId where the microservice is going to be deployed'
  
  EcsDefaultSecurityGroup:
    Type: String
    Description: 'Default security group required by infrastructure'

  ApplicationLoadBalancerListenerArn:
    Type: String
    Description: 'Load balancer listener where HTTP endpoints is going to be registered'

  ApplicationLoadBalancerDomain:
    Type: String
    Description: 'Base URL of the load balancer where the service is going to be reachable'

  NetworkLoadBalancerLink:
    Type: String
    Description: 'network load balancer link for API-GW'

  EnableAPIGatewayAppIO:
    Type: String
    Description: 'Determina se le risorse API Gateway debbano essere create (true/false)'
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'

  # OpenApi Bucket params
  MicroserviceBucketName:
    Type: String
    Default: ''
    Description: 'Name of the bucket where the microservice files are copied during deploy'

  MicroserviceBucketBaseKey:
    Type: String
    Default: ''
    Description: 'Base key of the microservice in the s3 bucket'

  MandatesDynamoTableName:
    Type: String
    Description: 'Name of dynamodb table containing mandates'

  MandatesDynamoTableHistoryName:
    Type: String
    Description: 'Name of dynamodb table containing mandates history'

  MandatesDynamoTableArn:
    Type: String
    Description: 'ARN of dynamodb table containing mandates'

  PnMandateInputsQueueURL:
    Type: String
    Description: pn-mandate_inputs queue URL

  MandatesDynamoTableHistoryArn:
    Type: String
    Description: 'ARN of dynamodb table containing mandates history'

  MandatesDynamoTableNameStreamArn:
    Type: String
    Description: ARN of dynamodb table containing stream mandates

  PnMandateExpiredTriggerDLQAlarmARN:
    Type: String
    Description: pn-mandate_expired_trigger_DLQ alarm ARN

  PnMandateInputsQueueAgeAlarmARN:
    Type: String
    Description: pn-mandate_inputs queue age ARN DLQ

  PnMandateExpiredTriggerDLQARN:
    Type: String
    Description: pn-mandate_expired_trigger_DLQ queue ARN

  PnMandateInputsQueueARN:
    Type: String
    Description: pn-mandate_inputs queue ARN

  PnMandateInputsQueueAlarmARN:
    Type: String
    Description: pn-mandate_inputs queue ARN DLQ

  PnMandateInputsQueueName:
    Type: String
    Description: pn-mandate_inputs queue name

  LogsKinesisSourceStreamArn:
    Type: String
    Description: 'Kinesis stream that receive logs'
  
  Version:
    Type: String
    Description: 'keep track of used projects commitIds'

  AlbSecurityGroup:
    Type: String
    Description: 'Application load balancer security group'

  Mandate2DeliveryQueueName:
    Type: String
    Description: 'The name of the SQS queue used to communicate with pn-delivery module.'

  Mandate2DeliveryQueueARN:
    Type: String
    Description: 'Identify the resource that the policy applies to.'

  PendingDuration:
    Type: String
    Description: 'Durata del pending massima oltre il quale la delega non accettata scade'

  CiePendingDuration:
    Type: String
    Description: 'Durata del pending massima oltre il quale la delega creata con AppIO non accettata scade'

  CieValidToDuration:
    Type: String
    Description: 'Durata della validità della delega creata con AppIO (impostata nel processo di accettazione)'

  RevokeCieMandateOnVerificationFailure:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: 'Se true, la revoca della delega CIE viene effettuata automaticamente in caso di nonce incongruente rispetto al validationCode della delega'

  PnMandateExpiredTriggerLambdaEventSourceMappingBatchSize:
    Type: String
    Description: 'BatchSize stream mapping'

  PnMandateExpiredTriggerLambdaEventSourceMappingMaximumBatchingWindowInSeconds:
    Type: String
    Description: 'BatchWindow stream mapping'

  PnMandateExpiredTriggerLambdaEventSourceMappingMaximumRetryAttempts:
    Type: String
    Description: 'MaxRetry stream mapping'

  LogsKinesisFilterPattern:
    Type: String
    Default: ""
    Description: 'Log kinesis filter pattern'

  # Log group exports
  EcsLogGroup:
    Type: String

  PnMandateExpiredTriggerLambdaName:
    Type: String

  # Heath Check parameters
  HealthCheckInterval:
    Description: Seconds between two health check
    Type: Number
    Default: 60

  HealthCheckTimeout:
    Description: health check timeout seconds
    Type: Number
    Default: 5
  
  HealthyThresholdCount:
    Description: |
      The number of consecutive health checks successes required before considering 
      an unhealthy target healthy. 
    Type: Number
    Default: 5
  
  UnhealthyThresholdCount:
    Description: |
      The number of consecutive health check failures required before considering a target unhealthy. 
    Type: Number
    Default: 2

  # Instance parameters
  # 256 (.25 vCPU) - Available memory values: 0.5GB, 1GB, 2GB
  # 512 (.5 vCPU) - Available memory values: 1GB, 2GB, 3GB, 4GB
  # 1024 (1 vCPU) - Available memory values: 2GB, 3GB, 4GB, 5GB, 6GB, 7GB, 8GB
  # 2048 (2 vCPU) - Available memory values: Between 4GB and 16GB in 1GB increments
  # 4096 (4 vCPU) - Available memory values: Between 8GB and 30GB in 1GB increments
  CpuValue:
    Type: Number
    Default: 1024
    Description: Fargate virtual CPU quantity 1024 equals one vCPU

  # 0.5GB, 1GB, 2GB - Available cpu values: 256 (.25 vCPU)
  # 1GB, 2GB, 3GB, 4GB - Available cpu values: 512 (.5 vCPU)
  # 2GB, 3GB, 4GB, 5GB, 6GB, 7GB, 8GB - Available cpu values: 1024 (1 vCPU)
  # Between 4GB and 16GB in 1GB increments - Available cpu values: 2048 (2 vCPU)
  # Between 8GB and 30GB in 1GB increments - Available cpu values: 4096 (4 vCPU)
  MemoryAmount:
    Type: String
    Default: 2GB
    Description: memory amount reserved to the task pod.
    AllowedValues: [ 2GB, 4GB, 6GB, 8GB ]

  # Autoscaling parameters
  AutoscalingCheckPeriod:
    Default: 60
    Type: Number
    Description: minimum autoscaling number of tasks\

  AutoscalingDataPointN:
    Default: 1
    Type: Number
    Description: activate when N datapoint on M

  AutoscalingDataPointM:
    Default: 1
    Type: Number
    Description: activate when N datapoint on M

  AutoscalingThreshold:
    Default: 70
    Type: String
  
  MinTasksNumber:
    Default: 1
    Type: Number
    Description: minimum autoscaling number of tasks

  MaxTasksNumber:
    Default: 6
    Type: Number
    Description: maximum autoscaling number of tasks

  LogAlarmStrategy:
    Type: String
    Default: 'FATAL'

  B2bPgLimit:
    Default: 600000
    Type: Number
    Description: B2B PG WAG limit

  # EFS parameters
  FargateEFSFileSystemID:
    Type: String
    Description: "EFS Filesystem"

  MountEfs:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  # Logging parameters
  WireTapLogActivation:
    Type: String
    Default: false
    Description: Activation of wire logs
    AllowedValues:
      - true
      - false

  PnCronAnalyzer:
    Type: String
    Default: '-'
    Description: Cron for which you send the metric to CloudWatch
  
  CscaMasterlistUrl:
    Type: String
    Default: 'https://csca-ita.interno.gov.it/certificatiCSCA/IT_MasterListCSCA.zip'
    Description: 'URL of the CSCA masterlist zip file to download'

  CscaSyncSchedule:
    Type: String
    Default: 'rate(10 minutes)'
    Description: 'Schedule expression for the CSCA masterlist sync lambda (e.g., rate(1 hour) or cron expression)'

  CscaMasterlistSyncAlarmPeriod:
    Type: Number
    Default: 600
    Description: 'Period in seconds for the CSCA masterlist sync Lambda alarm metrics'

  CscaMasterlistSyncAlarmEvaluationPeriods:
    Type: Number
    Default: 12
    Description: 'Number of periods evaluated by the CSCA masterlist sync Lambda alarm'

  CscaMasterlistSyncAlarmDatapointsToAlarm:
    Type: Number
    Default: 10
    Description: 'Number of breaching periods required for the CSCA masterlist sync Lambda alarm'

  CscaSha256SsmParameterName:
    Type: String
    Default: '/pn-mandate/csca-masterlist/latest-sha256'
    Description: 'Full name of the SSM Parameter Store parameter to store the last SHA256 hash'
  
  CscaSyncS3BucketPrefix:
    Type: String
    Description: 'S3 bucket prefix for the CSCA Masterlist zip file'
  
  IoApiDnsName:
    Type: String
    Description: "The DNS name used for IO rest API."
  
  IOBackendCidrs:
    Type: String
    Default: ''

  ApplicativeEnvFileChecksum:
    Type: String
    Default: ''
    Description: 'Applicative environment variable file checksum'

  IsLollipopActive:
    Type: String
    Description: "lollipop authorization activation flag"
    AllowedValues: [ true, false ]
    Default: false

  LollipopExpectedLcOriginalUrl:
    Type: String
    Description: "expected lollipop consumer original url"

  LollipopEnableConsumerLogging:
    Type: String
    Description: "enable lollipop consumer logging"

  LollipopIdpRestConfigReadTimeout:
    Type: String
    Default: "8000ms"
    Description: Read timeout for Lollipop Idp endpoint in duration format

  LollipopIdpRestConfigConnectionTimeout:
    Type: String
    Default: "3000ms"
    Description: Connection timeout for Lollipop Idp endpoint in duration format

  LollipopAssertionRestConfigReadTimeout:
    Type: String
    Default: "8000ms"
    Description: Read timeout for Lollipop Assertion endpoint in duration format

  LollipopAssertionRestConfigConnectionTimeout:
    Type: String
    Default: "3000ms"
    Description: Connection timeout for Lollipop Assertion endpoint in duration format

  LollipopExpectedLcOriginalMethod:
    Type: String
    Description: "expected lollipop consumer original method (list separated by ;)"

  CieValidationCertS3Path:
    Type: String
    Description: "S3 path to the validation certificate (env-specific)."
  
  CscaMasterlistSyncLambdaName:
    Type: String
    Description: 'Name of the CscaMasterlistSync lambda function, valorized by storage.yml related output.'

  LollipopWhiteList:
    Type: String
    Description: "Comma separated list of whitelisted CNs for Lollipop requests"
    Default: ""

  # Custom metrics parameters
  MetricNamespace:
    Type: String
    Description: "CloudWatch custom metric namespace"
    Default: "Advanced"

  MandateAcceptanceFailureF01AlarmPeriodFilterPattern:
    Type: String

  MandateAcceptanceFailureF01AlarmPeriod:
    Type: Number
    Default: 300

  MandateAcceptanceFailureF01AlarmThreshold:
    Type: Number
    Default: 1

  MandateAcceptanceFailureF01AlarmEvaluationPeriods:
    Type: Number
    Default: 12

  MandateAcceptanceFailureF01AlarmPeriodDatapointsToAlarm:
    Type: Number
    Default: 1

  MandateAcceptanceFailureF01AlarmEnableOncall:
    Type: String
    Description: "Create onCall alarm"
    Default: false
    AllowedValues:
      - true
      - false

  OncallMandateAcceptanceFailureF01AlarmPeriod:
    Type: Number
    Default: 300

  OncallMandateAcceptanceFailureF01AlarmThreshold:
    Type: Number
    Default: 1

  OncallMandateAcceptanceFailureF01AlarmEvaluationPeriods:
    Type: Number
    Default: 12

  OncallMandateAcceptanceFailureF01AlarmPeriodDatapointsToAlarm:
    Type: Number
    Default: 1

  MandateAcceptanceFailureF02AlarmPeriodFilterPattern:
    Type: String

  MandateAcceptanceFailureF02AlarmPeriod:
    Type: Number
    Default: 300

  MandateAcceptanceFailureF02AlarmThreshold:
    Type: Number
    Default: 1

  MandateAcceptanceFailureF02AlarmEvaluationPeriods:
    Type: Number
    Default: 12

  MandateAcceptanceFailureF02AlarmPeriodDatapointsToAlarm:
    Type: Number
    Default: 1

