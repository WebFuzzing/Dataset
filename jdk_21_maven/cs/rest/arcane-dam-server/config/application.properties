aws.access_key=test
aws.secret_key=test
aws.region=us-east-1
aws.endpoint=http://localhost:4566
aws.s3.bucket-name=arcane-bucket
aws.sdk.print-location=false
aws.sdk.disable-deprecation=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:4566/.well-known/jwks.json
sample.jwe-key-value=classpath:certs/jwe.priv
spring.security.oauth2.client.registration.cognito.client-id=test-client-id
spring.security.oauth2.client.registration.cognito.client-secret=test-client-secret
spring.security.oauth2.client.registration.cognito.scope=openid
spring.security.oauth2.client.provider.cognito.issuer-uri=http://localhost:4566/cognito
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

app.security.enabled=false
springdoc.api-docs.version=OPENAPI_3_0
