services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: "0:0"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-minlog.csv}
    command: >
      mitmdump 
        --mode reverse:http://sut-management-cassandra:8080
        --listen-host 0.0.0.0
        --listen-port 8080
        --set keep_host_header=true
        -s /addons/minlog.py
    volumes:
      - ${HOST_LOG_DIR:-./mitm-logs}:/custom-logs
      - ./addons:/addons:ro
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - sut-management-cassandra
  sut-management-cassandra:
    image: webfuzzing/wfd-management-cassandra:FINAL
#    build:
#      dockerfile: ./dockerfiles/management-cassandra.dockerfile
#      context: ..
    environment:
       AUTH_PORT: ${AUTH_PORT:-8081}
    ports:
      - "${JACOCO_PORT:-6300}:6300"
    depends_on:
      cassandra:
          condition: service_healthy
  cassandra:
    image: k8ssandra/cass-management-api:4.1.12-v0.1.126
    environment:
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
      JVM_EXTRA_OPTS: -Ddb.unix_socket_file=/tmp/mgmtapi.sock
    volumes:
      - ./additional_files/management-cassandra/mgmtapi-bridge.py:/mgmtapi-bridge.py
    healthcheck:
      test: test -S /tmp/mgmtapi.sock && cqlsh -e "SELECT now() FROM system.local"
      interval: 30s
      timeout: 30s
      retries: 3
    command: ["bash", "-c", 'python3 /mgmtapi-bridge.py /tmp/mgmtapi.sock 9999 & exec cassandra -f']