services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: "0:0"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-minlog.csv}
    command: >
      mitmdump 
        --mode reverse:http://sut-gdpr-kv:8080
        --listen-host 0.0.0.0
        --listen-port 8080
        --set keep_host_header=true
        -s /addons/minlog.py
    volumes:
      - ${HOST_LOG_DIR:-./mitm-logs}:/custom-logs
      - ./addons:/addons:ro
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - sut-gdpr-kv
  sut-gdpr-kv:
    image: webfuzzing/wfd-gdpr-kv:FINAL
#    build:
#      dockerfile: ./dockerfiles/gdpr-kv.dockerfile
#      context: ..
    environment:
       AUTH_PORT: ${AUTH_PORT:-8081}
    ports:
      - "${JACOCO_PORT:-6300}:6300"
    depends_on:
      db:
          condition: service_healthy
  db:
    image: localstack/localstack:3.6
    environment:
      SERVICES: dynamodb
      DEFAULT_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
    healthcheck:
      test: awslocal dynamodb create-table --table-name subjects --billing-mode PAY_PER_REQUEST --attribute-definitions AttributeName=subject_id,AttributeType=S --key-schema AttributeName=subject_id,KeyType=HASH >/dev/null 2>&1 || true; awslocal dynamodb create-table --table-name policies --billing-mode PAY_PER_REQUEST --attribute-definitions AttributeName=purpose,AttributeType=S --key-schema AttributeName=purpose,KeyType=HASH >/dev/null 2>&1 || true; awslocal dynamodb create-table --table-name records --billing-mode PAY_PER_REQUEST --attribute-definitions AttributeName=subject_id,AttributeType=S AttributeName=record_key,AttributeType=S AttributeName=purge_bucket,AttributeType=S AttributeName=purge_due_at,AttributeType=N --key-schema AttributeName=subject_id,KeyType=HASH AttributeName=record_key,KeyType=RANGE --global-secondary-indexes '[{"IndexName":"records_by_purge_due","KeySchema":[{"AttributeName":"purge_bucket","KeyType":"HASH"},{"AttributeName":"purge_due_at","KeyType":"RANGE"}],"Projection":{"ProjectionType":"KEYS_ONLY"}}]' >/dev/null 2>&1 || true; awslocal dynamodb create-table --table-name audit_events --billing-mode PAY_PER_REQUEST --attribute-definitions AttributeName=subject_id,AttributeType=S AttributeName=ts_ulid,AttributeType=S --key-schema AttributeName=subject_id,KeyType=HASH AttributeName=ts_ulid,KeyType=RANGE >/dev/null 2>&1 || true; awslocal dynamodb put-item --table-name policies --item '{"purpose":{"S":"DEMO_PURPOSE"},"retention_days":{"N":"1"},"description":{"S":"Demo retention policy"},"last_updated_at":{"N":"1700000000000"}}' && awslocal dynamodb put-item --table-name subjects --item '{"subject_id":{"S":"demo_subject_001"},"created_at":{"N":"1700000000000"},"residency":{"S":"US"},"request_id":{"S":"seed"}}' && awslocal dynamodb put-item --table-name records --item '{"subject_id":{"S":"demo_subject_001"},"record_key":{"S":"pref:email"},"purpose":{"S":"DEMO_PURPOSE"},"value":{"S":"{\"email\":\"demo@example.invalid\"}"},"created_at":{"N":"1700000000000"},"updated_at":{"N":"1700000000000"},"version":{"N":"1"},"retention_days":{"N":"1"},"tombstoned":{"BOOL":false},"request_id":{"S":"seed"}}'
      interval: 30s
      timeout: 30s
      retries: 3