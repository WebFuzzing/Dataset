services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: "0:0"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-minlog.csv}
    command: >
      mitmdump 
        --mode reverse:http://sut-gdpr-kv:8080
        --listen-host 0.0.0.0
        --listen-port 8080
        --set keep_host_header=true
        -s /addons/minlog.py
    volumes:
      - ${HOST_LOG_DIR:-./mitm-logs}:/custom-logs
      - ./addons:/addons:ro
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - sut-gdpr-kv
  sut-gdpr-kv:
    image: webfuzzing/wfd-gdpr-kv:FINAL
#    build:
#      dockerfile: ./dockerfiles/gdpr-kv.dockerfile
#      context: ..
    environment:
       AUTH_PORT: ${AUTH_PORT:-8081}
    ports:
      - "${JACOCO_PORT:-6300}:6300"
    depends_on:
      db:
          condition: service_healthy
  db:
    image: localstack/localstack:3.6
    environment:
      SERVICES: dynamodb
      DEFAULT_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
    volumes:
      - ./additional_files/gdpr-kv/init-dynamodb.sh:/etc/localstack/init/ready.d/init-dynamodb.sh
    healthcheck:
      test: awslocal dynamodb get-item --table-name policies --key '{"purpose":{"S":"DEMO_PURPOSE"}}' | grep -q DEMO_PURPOSE
      interval: 30s
      timeout: 30s
      retries: 3