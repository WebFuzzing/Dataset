services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: "0:0"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-minlog.csv}
    command: >
      mitmdump 
        --mode reverse:http://sut-adoptme:8080
        --listen-host 0.0.0.0
        --listen-port 8080
        --set keep_host_header=true
        -s /addons/minlog.py
    volumes:
      - ${HOST_LOG_DIR:-./mitm-logs}:/custom-logs
      - ./addons:/addons:ro
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - sut-adoptme
  sut-adoptme:
    image: webfuzzing/wfd-adoptme:FINAL
#    build:
#      dockerfile: ./dockerfiles/adoptme.dockerfile
#      context: ..
    environment:
       AUTH_PORT: ${AUTH_PORT:-8081}
    ports:
      - "${JACOCO_PORT:-6300}:6300"
    depends_on:
      db:
          condition: service_healthy
  db:
    image: neo4j:5.26
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - '/data'
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    healthcheck:
      test: ['CMD', 'cypher-shell', '-u', 'neo4j', '-p', 'neo4j123', 'RETURN 1']
      interval: 30s
      timeout: 30s
      retries: 3