services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: "0:0"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-minlog.csv}
    command: >
      mitmdump 
        --mode reverse:http://sut-testing-system:8080
        --listen-host 0.0.0.0
        --listen-port 8080
        --set keep_host_header=true
        -s /addons/minlog.py
    volumes:
      - ${HOST_LOG_DIR:-./mitm-logs}:/custom-logs
      - ./addons:/addons:ro
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - sut-testing-system
  sut-testing-system:
    image: webfuzzing/wfd-testing-system:FINAL
#    build:
#      dockerfile: ./dockerfiles/testing-system.dockerfile
#      context: ..
    environment:
       AUTH_PORT: ${AUTH_PORT:-8081}
    ports:
      - "${JACOCO_PORT:-6300}:6300"
    depends_on:
      db:
          condition: service_healthy
      redis:
          condition: service_healthy
  db:
    image: postgres:17.2
    tmpfs:
      - '/var/lib/postgresql/data'
    environment:
      POSTGRES_DB: testing_system
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - ./additional_files/testing-system/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./additional_files/testing-system/02_insert_data.sql:/docker-entrypoint-initdb.d/02_insert_data.sql
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U root -d testing_system
      interval: 30s
      timeout: 30s
      retries: 3
  redis:
    image: redis:7.4
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 30s
      retries: 3