services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: "0:0"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-minlog.csv}
    command: >
      mitmdump 
        --mode reverse:http://sut-kafka-publisher:8080
        --listen-host 0.0.0.0
        --listen-port 8080
        --set keep_host_header=true
        -s /addons/minlog.py
    volumes:
      - ${HOST_LOG_DIR:-./mitm-logs}:/custom-logs
      - ./addons:/addons:ro
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - sut-kafka-publisher
  sut-kafka-publisher:
    image: webfuzzing/wfd-kafka-publisher:FINAL
#    build:
#      dockerfile: ./dockerfiles/kafka-publisher.dockerfile
#      context: ..
    environment:
       AUTH_PORT: ${AUTH_PORT:-8081}
    ports:
      - "${JACOCO_PORT:-6300}:6300"
    depends_on:
      elasticsearch:
          condition: service_healthy
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    tmpfs:
      - '/usr/share/elasticsearch/data'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./additional_files/kafka-publisher/seed.sh:/seed.sh
    healthcheck:
      test: bash /seed.sh
      interval: 30s
      timeout: 30s
      retries: 3