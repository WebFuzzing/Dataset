services:
  mitmproxy:
    image: mitmproxy/mitmproxy:10.2.4
    user: "0:0"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_LOG_FILE: ${MITM_LOG_FILE:-minlog.csv}
    command: >
      mitmdump 
        --mode reverse:http://sut-pn-paper-tracker:8080
        --listen-host 0.0.0.0
        --listen-port 8080
        --set keep_host_header=true
        -s /addons/minlog.py
    volumes:
      - ${HOST_LOG_DIR:-./mitm-logs}:/custom-logs
      - ./addons:/addons:ro
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      - sut-pn-paper-tracker
  sut-pn-paper-tracker:
    image: webfuzzing/wfd-pn-paper-tracker:FINAL
#    build:
#      dockerfile: ./dockerfiles/pn-paper-tracker.dockerfile
#      context: ..
    environment:
       AUTH_PORT: ${AUTH_PORT:-8081}
    ports:
      - "${JACOCO_PORT:-6300}:6300"
    depends_on:
      db:
          condition: service_healthy
  db:
    image: localstack/localstack:4.4
    environment:
      SERVICES: dynamodb,sqs
    volumes:
      - ./additional_files/pn-paper-tracker/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
    healthcheck:
      test: awslocal sqs get-queue-url --queue-name pn-external_channel_to_paper_channel
      interval: 30s
      timeout: 30s
      retries: 3