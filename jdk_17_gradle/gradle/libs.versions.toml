[versions]
indra = "3.1.1"
# komga
sqliteJdbc = "3.53.2.1"
nightmonkeys = "1.1.0"
twelvemonkeys = "3.14.0"
springboot = "3.5.16"
lucene = "9.9.1" # v10 requires JDK 21
jooq = "3.19.35" # should be aligned with the version provided by Spring Boot

[plugins]
indra = { id = "net.kyori.indra", version.ref = "indra" }
indra-checkstyle = { id = "net.kyori.indra.checkstyle", version.ref = "indra" }
spotless = { id = "com.diffplug.spotless", version = "6.19.0" }
spring-boot = { id = "org.springframework.boot", version = "3.1.1" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.1" }
# komga
gradleGitProperties = { id = "com.gorylenko.gradle-git-properties", version = "4.0.1" }

[libraries]
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version = "24.0.1" }
springdoc-openapi-starter-webmvc-ui = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version = "2.1.0" }
stylecheck = { group = "ca.stellardrift", name = "stylecheck", version = "0.2.1" }
